<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title description">
  <title id="title">Zeus OS aurora dark</title>
  <desc id="description">Deep navy space with layered indigo, violet, and coral ribbons flowing toward a quiet horizon.</desc>
  <metadata>Original Zeus OS artwork, CC0-1.0.</metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D20"/>
      <stop offset="0.44" stop-color="#101936"/>
      <stop offset="1" stop-color="#241D43"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="16%" cy="8%" r="72%">
      <stop offset="0" stop-color="#263E7E" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#1A2B5D" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#152041" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lavenderGlow" cx="90%" cy="20%" r="68%">
      <stop offset="0" stop-color="#7F64C8" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#534DA1" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#2C2B61" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow" cx="70%" cy="92%" r="60%">
      <stop offset="0" stop-color="#D76A8A" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#914C88" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4C326A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueRibbon" x1="0" y1="0" x2="1" y2="0.65">
      <stop offset="0" stop-color="#3D68D1" stop-opacity="0.08"/>
      <stop offset="0.29" stop-color="#557FE1" stop-opacity="0.42"/>
      <stop offset="0.62" stop-color="#776FD2" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8F9BE5" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="violetRibbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4A63C1" stop-opacity="0.09"/>
      <stop offset="0.35" stop-color="#7860C9" stop-opacity="0.35"/>
      <stop offset="0.72" stop-color="#B36FB5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D68CAC" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="peachRibbon" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#BA547C" stop-opacity="0.03"/>
      <stop offset="0.44" stop-color="#D46A89" stop-opacity="0.26"/>
      <stop offset="0.77" stop-color="#9B6CBD" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#6B84D1" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9BBEFF" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#AFCBFF" stop-opacity="0.48"/>
      <stop offset="0.61" stop-color="#D7C6FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9BBEFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="softBlur" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="canvas"><rect width="3840" height="2160"/></clipPath>
  </defs>

  <rect width="3840" height="2160" fill="url(#base)"/>
  <rect width="3840" height="2160" fill="url(#topGlow)"/>
  <rect width="3840" height="2160" fill="url(#lavenderGlow)"/>
  <rect width="3840" height="2160" fill="url(#coralGlow)"/>

  <g clip-path="url(#canvas)" fill="none" stroke-linecap="round">
    <path d="M-420 1420C350 720 1010 780 1580 1220S2780 2160 4260 1180" stroke="#4E71D5" stroke-opacity="0.20" stroke-width="420" filter="url(#blur)"/>
    <path d="M-420 1650C340 1030 920 1020 1510 1430S2840 2280 4260 1360" stroke="url(#blueRibbon)" stroke-width="280"/>
    <path d="M-420 1650C340 1030 920 1020 1510 1430S2840 2280 4260 1360" stroke="url(#edgeLight)" stroke-opacity="0.34" stroke-width="7" transform="translate(0 -125)"/>

    <path d="M-420 950C410 430 1110 500 1730 930S2910 1540 4260 700" stroke="#8561C6" stroke-opacity="0.18" stroke-width="310" filter="url(#blur)"/>
    <path d="M-420 1010C400 470 1110 560 1710 990S2910 1590 4260 760" stroke="url(#violetRibbon)" stroke-width="190"/>
    <path d="M-420 1010C400 470 1110 560 1710 990S2910 1590 4260 760" stroke="#D0C7FF" stroke-opacity="0.22" stroke-width="5" transform="translate(0 -74)"/>

    <path d="M-460 2040C460 1510 1210 1490 1840 1760S3020 2300 4300 1740" stroke="#C95D83" stroke-opacity="0.16" stroke-width="240" filter="url(#blur)"/>
    <path d="M-460 2020C470 1480 1200 1500 1830 1770S3030 2260 4300 1690" stroke="url(#peachRibbon)" stroke-width="126"/>
    <path d="M-460 2020C470 1480 1200 1500 1830 1770S3030 2260 4300 1690" stroke="#F5B7C7" stroke-opacity="0.22" stroke-width="4" transform="translate(0 -44)"/>

    <path d="M-340 720C420 210 1040 250 1480 520S2630 1080 4140 280" stroke="#819BEA" stroke-opacity="0.16" stroke-width="4"/>
    <path d="M-220 1870C620 1320 1100 1330 1660 1620S2960 2100 4140 1500" stroke="#7D9CEB" stroke-opacity="0.30" stroke-width="4"/>
    <path d="M-180 1912C610 1400 1140 1380 1690 1660S2980 2130 4070 1550" stroke="#C58ADB" stroke-opacity="0.24" stroke-width="3"/>
  </g>

  <g fill="#B9D0FF" opacity="0.52">
    <circle cx="520" cy="392" r="4"/>
    <circle cx="3220" cy="430" r="3"/>
    <circle cx="3580" cy="1110" r="5" opacity="0.42"/>
    <circle cx="740" cy="1530" r="3" opacity="0.36"/>
