    <circle cx="3420" cy="1040" r="5" fill="#809EFF" fill-opacity="0.25" stroke="none"/>
    <circle cx="520" cy="1320" r="3" fill="#9CB7FF" fill-opacity="0.32" stroke="none"/>
  </g>

  <g transform="translate(1920 1030)" fill="none" stroke-linejoin="round">
    <circle r="274" stroke="#8DABFF" stroke-opacity="0.12" stroke-width="2"/>
    <circle r="214" stroke="#94B1FF" stroke-opacity="0.14" stroke-width="2" stroke-dasharray="2 22"/>
    <path d="M-188-128H190L34 0L190 128H-188L-34 0Z" fill="url(#mark)" fill-opacity="0.78" stroke="#C0D8FF" stroke-opacity="0.64" stroke-width="5"/>
    <path d="M-122-74H92L28-22H-122Z" fill="#E8F2FF" fill-opacity="0.52" stroke="none"/>
    <path d="M-28 22H122L92 74H-92Z" fill="#D0CCFF" fill-opacity="0.42" stroke="none"/>
