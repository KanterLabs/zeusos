<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title description">
  <title id="title">Zeus OS aurora light</title>
  <desc id="description">Soft blue, lavender, and coral ribbons sweep across a bright atmospheric background.</desc>
  <metadata>Original Zeus OS artwork, CC0-1.0.</metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="0.46" stop-color="#EDF3FF"/>
      <stop offset="1" stop-color="#D7E2F6"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="17%" cy="12%" r="76%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.45" stop-color="#EAF1FF" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#C9D7F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lavenderGlow" cx="89%" cy="22%" r="68%">
      <stop offset="0" stop-color="#C6BCFF" stop-opacity="0.58"/>
      <stop offset="0.43" stop-color="#B9C9FA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B9C9FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow" cx="69%" cy="89%" r="56%">
      <stop offset="0" stop-color="#FFB7AA" stop-opacity="0.45"/>
      <stop offset="0.54" stop-color="#F7C9D3" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F7C9D3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueRibbon" x1="0" y1="0" x2="1" y2="0.65">
      <stop offset="0" stop-color="#5578E9" stop-opacity="0.08"/>
      <stop offset="0.29" stop-color="#638DEB" stop-opacity="0.42"/>
      <stop offset="0.62" stop-color="#8C86E8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#A5B6EF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="violetRibbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7386DD" stop-opacity="0.10"/>
      <stop offset="0.35" stop-color="#8C78D6" stop-opacity="0.32"/>
      <stop offset="0.72" stop-color="#C68DD8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#F0B3CF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="peachRibbon" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#F7AFA5" stop-opacity="0.04"/>
      <stop offset="0.44" stop-color="#F1A3B7" stop-opacity="0.25"/>
      <stop offset="0.77" stop-color="#D59DDA" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A6B2EE" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.58"/>
      <stop offset="0.61" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="softBlur" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="canvas"><rect width="3840" height="2160"/></clipPath>
  </defs>

  <rect width="3840" height="2160" fill="url(#base)"/>
  <rect width="3840" height="2160" fill="url(#topGlow)"/>
  <rect width="3840" height="2160" fill="url(#lavenderGlow)"/>
  <rect width="3840" height="2160" fill="url(#coralGlow)"/>

  <g clip-path="url(#canvas)" fill="none" stroke-linecap="round">
    <path d="M-420 1420C350 720 1010 780 1580 1220S2780 2160 4260 1180" stroke="#748FEA" stroke-opacity="0.12" stroke-width="420" filter="url(#blur)"/>
    <path d="M-420 1650C340 1030 920 1020 1510 1430S2840 2280 4260 1360" stroke="url(#blueRibbon)" stroke-width="280"/>
    <path d="M-420 1650C340 1030 920 1020 1510 1430S2840 2280 4260 1360" stroke="url(#edgeLight)" stroke-opacity="0.36" stroke-width="7" transform="translate(0 -125)"/>

    <path d="M-420 950C410 430 1110 500 1730 930S2910 1540 4260 700" stroke="#B185D7" stroke-opacity="0.10" stroke-width="310" filter="url(#blur)"/>
    <path d="M-420 1010C400 470 1110 560 1710 990S2910 1590 4260 760" stroke="url(#violetRibbon)" stroke-width="190"/>
    <path d="M-420 1010C400 470 1110 560 1710 990S2910 1590 4260 760" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" transform="translate(0 -74)"/>

    <path d="M-460 2040C460 1510 1210 1490 1840 1760S3020 2300 4300 1740" stroke="#F0A4B8" stroke-opacity="0.11" stroke-width="240" filter="url(#blur)"/>
    <path d="M-460 2020C470 1480 1200 1500 1830 1770S3030 2260 4300 1690" stroke="url(#peachRibbon)" stroke-width="126"/>
    <path d="M-460 2020C470 1480 1200 1500 1830 1770S3030 2260 4300 1690" stroke="#FFF4F5" stroke-opacity="0.25" stroke-width="4" transform="translate(0 -44)"/>

    <path d="M-340 720C420 210 1040 250 1480 520S2630 1080 4140 280" stroke="#A4B8F0" stroke-opacity="0.18" stroke-width="4"/>
    <path d="M-220 1870C620 1320 1100 1330 1660 1620S2960 2100 4140 1500" stroke="#829AE8" stroke-opacity="0.28" stroke-width="4"/>
    <path d="M-180 1912C610 1400 1140 1380 1690 1660S2980 2130 4070 1550" stroke="#C49CDC" stroke-opacity="0.22" stroke-width="3"/>
  </g>

  <g fill="#FFFFFF" opacity="0.42">
    <circle cx="520" cy="392" r="4"/>
    <circle cx="3220" cy="430" r="3"/>
    <circle cx="3580" cy="1110" r="5" opacity="0.38"/>
    <circle cx="740" cy="1530" r="3" opacity="0.34"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M280 520L570 360" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M3290 1710L3650 1510" stroke-opacity="0.18" stroke-width="2"/>
  </g>
