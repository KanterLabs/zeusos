<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Zeus Updates</title>
  <desc id="description">A rounded indigo tile with a luminous upward update arrow surrounded by a circular progress arc.</desc>
  <defs>
    <linearGradient id="tile" x1="28" y1="16" x2="228" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6888EE"/>
      <stop offset="0.48" stop-color="#3C51B0"/>
      <stop offset="1" stop-color="#30266D"/>
    </linearGradient>
    <linearGradient id="arc" x1="65" y1="64" x2="194" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0F7FF"/>
      <stop offset="0.42" stop-color="#B5D5FF"/>
      <stop offset="1" stop-color="#D7A4F5"/>
    </linearGradient>
    <linearGradient id="arrow" x1="106" y1="89" x2="161" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#D9ECFF"/>
      <stop offset="1" stop-color="#9AB8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="68%">
      <stop offset="0" stop-color="#AFC7FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8194EB" stop-opacity="0"/>
    </radialGradient>
