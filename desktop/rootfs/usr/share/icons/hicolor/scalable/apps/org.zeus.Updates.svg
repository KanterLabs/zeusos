    <path d="M184 103A61 61 0 1 0 190 145" fill="none" stroke="url(#arc)" stroke-width="15" stroke-linecap="round"/>
    <path d="M173 75H205V107" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
