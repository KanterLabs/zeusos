name: Preview source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image-policy:
    runs-on: homelab
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Validate image inputs, assets and login policy
        run: python3 -m unittest discover -s tests -p test_image_contract.py -v
      - name: Preserve owner styles through visual changes
        run: python3 -m unittest discover -s tests -p test_style_preservation.py -v
      - name: Verify lock appearance lifecycle and native fallback
        run: node --test tests/lock_background.test.mjs
      - name: Verify Temp cleanup and migration
        run: python3 -m unittest discover -s tests -p "test_temp*.py" -v
      - name: Verify Chrome defaults and package trust
        run: python3 -m unittest discover -s tests -p 'test_browser*.py' -v
      - name: Verify pinned standalone Codex packaging
        run: |
          python3 -m unittest discover -s tests -p 'test_codex*.py' -v
          python3 -m py_compile scripts/install-codex.py scripts/validate-codex.py
      - name: Verify desktop interaction and battery measurement contracts
        run: |
          python3 -m unittest discover -s tests -p test_desktop_interactions.py -v
          python3 -m unittest discover -s tests -p test_battery_measurement.py -v
      - name: Check build script syntax
        run: bash -n scripts/build.sh scripts/build-disk.sh scripts/export-iteration.sh
      - name: Verify signed updater trust and transactions
        run: python3 -m unittest discover -s tests -p 'test_updat*.py' -v
      - name: Check updater syntax
        run: python3 -m py_compile desktop/rootfs/usr/lib/zeus/update_manifest.py desktop/rootfs/usr/lib/zeus/zeus_update.py desktop/rootfs/usr/libexec/zeus-update-window scripts/make-update-manifest.py
      - name: Check welcome application syntax
        run: python3 -m py_compile zeus/assets/welcome.py scripts/build-greeter-theme.py scripts/measure-*.py scripts/validate-*.py
      - name: Verify native laptop Settings
        run: |
          python3 -m unittest discover -s tests -p test_settings_window.py -v
          python3 -m py_compile desktop/rootfs/usr/libexec/zeus-settings-window
      - name: Verify Bluetooth audio readiness checks
        run: |
          python3 -m unittest discover -s tests -p test_bluetooth_audio.py -v
          python3 -m py_compile scripts/validate-bluetooth-audio.py
  cli:
    runs-on: homelab-heavy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Check Rust formatting
        run: cargo fmt --manifest-path zeus/Cargo.toml --check
      - name: Test and build CLI
        run: |
          cargo test --manifest-path zeus/Cargo.toml --locked --offline
          cargo build --manifest-path zeus/Cargo.toml --release --locked --offline
          python3 -m unittest discover -s tests -p test_cli.py -v
